<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 500px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .gender, .skills {
            margin-top: 8px;
        }

        .gender input,
        .skills input {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" required>

        <label for="college">College Name</label>
        <input type="text" id="college" name="college" required>

        <label for="branch">Branch</label>
        <select id="branch" name="branch">
            <option value="">Select Branch</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>IT</option>
        </select>

        <label>Gender</label>
        <div class="gender">
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male" style="display:inline;">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female" style="display:inline;">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other" style="display:inline;">Other</label>
        </div>

        <label>Skills</label>
        <div class="skills">
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html" style="display:inline;">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css" style="display:inline;">CSS</label>

            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js" style="display:inline;">JavaScript</label>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python" style="display:inline;">Python</label>
        </div>

        <label for="about">About Me</label>
        <textarea id="about" name="about" rows="4"></textarea>

        <button type="submit">Submit</button>

    </form>
</div>

</body>
</html>
